spring:
  application.name: monolith
  datasource:
    url: jdbc:h2:mem:booking;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate.ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.generate_statistics: true    # 쿼리 수 측정용 (B-M4)
  h2.console.enabled: true
